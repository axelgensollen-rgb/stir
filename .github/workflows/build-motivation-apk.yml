name: Compiler APK Samsung S24
on:
  push:
    branches: [motivation-s24-app]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extraire application
        run: tar -xJf MotivationVerrouillage.tar.xz
      - name: Construire APK
        run: gradle -p MotivationVerrouillage :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MotivationVerrouillage-APK
          path: MotivationVerrouillage/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
