name: Compilation Motivation Verrouillage APK
on:
  push:
    branches: [motivation-s24-app]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK compatible
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK de test
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Fournir APK installable
        uses: actions/upload-artifact@v4
        with:
          name: MotivationVerrouillage-Android-S24
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
