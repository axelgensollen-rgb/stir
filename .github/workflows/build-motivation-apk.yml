name: Compilation Motivation Verrouillage APK
on:
  push:
    branches: [motivation-s24-app]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler APK de test
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Fournir APK installable
        uses: actions/upload-artifact@v4
        with:
          name: MotivationVerrouillage-Android-S24
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
